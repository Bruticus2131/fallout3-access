; Fallout 3 Access — configuration
;
; File copied to: <Fallout 3 GOTY>\Data\FOSE\Plugins\Fallout3Access.ini
; Key codes are DirectInput scancodes (DIK_*). List:
;   https://www.nexusmods.com/skyrimspecialedition/articles/1175
; Most commonly used:
;   Enter=0x1C  Space=0x39  T=0x14  H=0x23  Q=0x10  X=0x2D  C=0x2E  F=0x21
;   F1=0x3B  F2=0x3C ... F12=0x58

[General]
Language    = auto     ; auto = the game's language (Polish game -> Polish, any other -> English); pl / en = force one
PreferSAPI  = 0        ; 1 = force SAPI even if NVDA/JAWS is detected
; Code page of the GAME's text (menu labels, item names).
;   0    = auto (pl -> 1250, otherwise the system ANSI code page)
;   1250 = Polish / Central European      1252 = English / Western
GameTextCodepage = 0

[Modules]
PipBoy     = 1
Dialog     = 1
Barter     = 1
Lockpick   = 1
VATS       = 1
NavAssist  = 1
WorldScan  = 1
Subtitles  = 1

[Voice]
SpeakOnMenuOpen    = 1
VerbosePipBoy      = 0     ; 1 = reads full item descriptions, not just names
ReadItemWeight     = 1
ReadItemValue      = 1
VatsTutorial       = 1     ; 1 = read the controls tutorial the first time VATS is opened
IntroAudioDesc     = 1     ; 1 = automatic audio description of the intro ("War. War never changes."); F8 turns it off while it plays
TargetCue          = 1     ; 1 = audio cue when the crosshair is on an enemy (aiming without VATS)
TargetCueHz        = 880   ; pitch of the cue tone (Hz); change it if it sounds bad (e.g. 660 lower, 1200 higher)
HudReader          = 1     ; 1 = read the hints and tutorials shown on the HUD
CrosshairNames     = 1     ; 1 = say the NAME of what the camera is looking at (not just "Take"/"Talk"); 0 = the verb only
CrosshairDistance  = 0     ; 1 = add the distance to the name under the camera; 0 = no distance (less talking)
NativeFace         = 1     ; 1 = turn to the target with the game engine's own function (like FaceObject from Command Extender); 0 = the old way (writing the angles)
AimBones           = 0     ; 1 = aim at the target's skeleton bones; 0 = (recommended) at the center of the model. WARNING: 1 reads the 3D model from the mod's thread and crashes the game.
AimMouseTakeover   = 0     ; 1 = moving the mouse breaks the target hold; 0 = (no mouse) only releasing aim breaks it
HostileFromCombat  = 1     ; 1 = (recommended) an enemy is whoever is fighting the player (we ask the engine); 0 = the nearest actor
;   Bone aiming was disabled after a crash; the cause was in the safety check, not in the method, and it is fixed.
;   Set it to 1 only to check whether shots start hitting.
AimCollision       = 0     ; 0 = aim at the center of the model (safe); 1 = try the collision shapes (has crashed the game)
NativeWalk         = 1     ; 1 = (recommended) auto-walk drives the player's movement directly, NO pressed keys - so it can always be stopped; 0 = the old way, with the W/A/S/D keys
AutoWalkSpeed      = 160   ; auto-walk speed in game units per second (with NativeWalk=1)
QuestArriveDist = 0      ; 0 = walk all the way to the marker (recommended); a larger number = stop that many units before it
;   A quest marker is a PLACE, not an object: it can sit inside scenery or behind
;   a line you are meant to stand in front of. Without this the walk circled it endlessly.
;   0 = off, walk right up to the marker.
WalkAnimation      = 1     ; 1 = walking animation during auto-walk (also brings back the game's real footstep sounds)
FootstepCue        = 1     ; 1 = footstep sound during auto-walk (the game plays none of its own while the mod drives movement)
BarterWarnLossCaps = 10    ; warning when you give away >=N caps of value
NearbyScanRadius   = 1200  ; in game units; ~64 units = 1 meter
NearbyScanMaxItems = 8
HideEmptyContainers = 1     ; 1 = the scanner skips empty containers, 0 = shows them marked "empty"
ExploreMode   = 1     ; 1 = during auto-walk the mod tells you about finds along the way (containers with loot, bodies, items, undiscovered places); Shift+O toggles
ExploreRadius = 900   ; how far from you still counts as "along the way" (game units, 200-4000)
AudioDescription = 1  ; audio description of scenes and characters, spoken in the pauses between lines (F7 repeats, Shift+F7 on/off)
AudioDescCapture = 0  ; 1 = saves a screenshot with every description to Documents\My Games\Fallout3\FOSE\ad_shots (for checking the descriptions); normally 0
EnginePath          = 1     ; 1 = the game engine plans the auto-walk route (as it does for characters), 0 = the mod's route only
Hints               = 1     ; game hints ("To fire..."): 0 = never, 1 = once per game session, 2 = every time
EngineAim           = 15    ; holding ] lets the game bend the shot toward an enemy by up to this many degrees (engine correction, enemies only); 0 = off
CompassUnits       = 0     ; 0 = clock hours, 1 = degrees
AutoWalkTurnGain   = 4     ; auto-walk turning strength; more = sharper, less = gentler
ActivatePickRadius = 150   ; activation tolerance (End); more = easier to hit, 0 = unchanged

[Hotkeys]
ReadSelection   = 0x1C   ; Enter   — read the currently selected item
RepeatLast      = 0x35   ; /       — repeat the last thing said
Silence         = 0x39   ; Space   — silence speech
WhereAmI        = 0x26   ; L       — player location
PlayerStatus    = 0x23   ; H       — HP, AP, RAD, caps
QuestTarget     = 0x25   ; K       — direction and distance to the quest marker
ScanNearby      = 0x2D   ; X       — nearest NPCs, doors, containers
ScanHostiles    = 0x2E   ; C       — enemies only
DescribeCompass = 0x24   ; J       — what is on the compass (F is taken by the game: change view)
ToggleMod       = 0x58   ; F12     — turn the mod on/off
DumpMenuTree    = 0x57   ; F11     — diagnostics: dump the active menu's tree to the log
DebugStartGame  = 0x44   ; F10     — run the [Debug] StartGameCommand command (e.g. coc)
MenuBack        = 0x0E   ; Backspace — go back one menu level (clicks the Back button)
RestoreDefaults = 0x13   ; R         — restore the default controls (on the controls settings page)
LockEnemy       = 0x14   ; T         - turn to the nearest enemy (if aiming fails, VATS then has the target in front of you)
SkipObjective   = 0x0D   ; =         — skip an unreachable objective (moves the quest one stage on); use deliberately
VatsBodyPart    = 0      ; disabled - in FO3 the B key exits VATS, and the button for changing body parts is invisible
CenterCamera    = 0xC7   ; Home      — level the view (pitch to 0; first person) — like "center camera"
IntroDescribe   = 0x42   ; F8        — intro audio description: starts by itself; F8 turns it off (or on manually for testing)
ScanPrev        = 0xC9   ; Page Up   — previous object (Shift+PgUp = previous category)
ScanNext        = 0xD1   ; Page Down — next object (Shift+PgDn = next category)
TurnTo          = 0x28   ; '         — turn to the selected object
GuideBeacon     = 0x27   ; ;         — sound beacon guiding you to the target (you walk with W yourself)
AutoWalk        = 0x2B   ; \         — walk to the target automatically (open ground)
GuideQuest      = 0x34   ; .         — sound beacon guiding you to the quest marker
ActivateTarget  = 0xCF   ; End       — activate the selected object (without aiming the crosshair)
CrosshairInfo   = 0x22   ; G         — say what is under the crosshair
ViewToggle      = 0x21   ; F         — the game's change-view key; the mod announces the result
ItemInfo        = 0x20   ; D         — description/details of the selected item (in menus)
AimTarget       = 0x33   ; ,         — aim the view at the selected/nearest target (shooting without VATS)
DropItem        = 0xD3   ; Delete    — drop the selected inventory item (lightens your load)
Sonar           = 0x31   ; N         — Pip-Boy sonar: a sound circles around you, each object answers from its own side (an enemy buzzes, a container rings, doors knock)
ExploreGo       = 0x18   ; O         — go to the find announced along the way; press again: back to the route (Shift+O: explore mode on/off)
SweepSummary    = 0x16   ; U         — what is left nearby to search (containers, bodies, items, notes, undiscovered places)
SweepNext       = 0x17   ; I         — lead to the nearest thing that is left; each press: the next one
AudioDescRepeat = 0x41   ; F7        — repeat the last audio description (Shift+F7: audio description on/off)
AimHold         = 0x1B   ; ]         — aiming on/off (same as holding the right mouse button)
AimCalibrate    = 0x00   ; none      (F9 is the game's quick load - set another key) — CALIBRATION: a sighted person aims at a chosen target
;   and presses this key. From that the mod works out the real height the shot is fired from —
;   the only measurement that does not come from our own records.
AimUp           = 0xC8   ; Up Arrow  — raise the aim point by 8 units
AimDown         = 0xD0   ; Down Arrow — lower the aim point by 8 units
;   The mod cannot see where the shot landed — you can hear it. These two keys fine-tune
;   vertical aim; a correction set once stays for all targets.
PressRow        = 0x3C   ; F2        — settings only: "click" the selected row (on the controls page: key rebinding mode). Insert is the NVDA key, and outside the settings F2 belongs to the game (Pip-Boy)
AttackKey       = 0x2F   ; V         — attack/fire key (the burst fired after aiming with ,); set it the same as in the game

[Debug]
; Console command run by the DebugStartGame hotkey (F10).
; From the main menu, "coc <cell>" starts a new game in that cell, skipping the intro.
; Candidates to try if MegatonWorld does not work:
;   coc MegatonWorld   coc Megaton   coc TestQAItems   coc Vault101
StartGameCommand = coc MegatonWorld
