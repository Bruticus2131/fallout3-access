; Fallout 3 Access — konfiguracja
;
; Plik kopiowany do: <Fallout 3 GOTY>\Data\FOSE\Plugins\Fallout3Access.ini
; Kody klawiszy to scancode DirectInput (DIK_*). Lista:
;   https://www.nexusmods.com/skyrimspecialedition/articles/1175
; Najczęściej używane:
;   Enter=0x1C  Spacja=0x39  T=0x14  H=0x23  Q=0x10  X=0x2D  C=0x2E  F=0x21
;   F1=0x3B  F2=0x3C ... F12=0x58

[General]
Language    = pl       ; pl albo en
PreferSAPI  = 0        ; 1 = wymuś SAPI nawet jeśli wykryto NVDA/JAWS
; Strona kodowa tekstu GRY (etykiety menu, nazwy itemów).
;   0    = auto (pl -> 1250, inaczej systemowa ANSI)
;   1250 = polski / środkowoeuropejski    1252 = angielski / zachodni
GameTextCodepage = 0

[Modules]
PipBoy     = 1
Dialog     = 1
Barter     = 1
Lockpick   = 1
VATS       = 1
NavAssist  = 1
WorldScan  = 1
Subtitles  = 1

[Voice]
SpeakOnMenuOpen    = 1
VerbosePipBoy      = 0     ; 1 = czyta całe opisy itemów, nie tylko nazwy
ReadItemWeight     = 1
ReadItemValue      = 1
VatsTutorial       = 1     ; 1 = przy pierwszym otwarciu VATS przeczytaj samouczek sterowania
IntroAudioDesc     = 1     ; 1 = automatyczna audiodeskrypcja intra ("Wojna nigdy się nie zmienia"); F8 wyłącza w trakcie
TargetCue          = 1     ; 1 = dźwiękowy sygnał, gdy celownik jest na wrogu (celowanie bez VATS)
TargetCueHz        = 880   ; wysokość tonu sygnału (Hz); zmień jeśli brzmi źle (np. 660 niżej, 1200 wyżej)
HudReader          = 1     ; 1 = czytaj podpowiedzi i samouczki pokazywane na HUD-zie
CrosshairNames     = 1     ; 1 = mów NAZWĘ tego, na co patrzy kamera (nie tylko "Weź"/"Rozmawiaj"); 0 = tylko czasownik
CrosshairDistance  = 0     ; 1 = dodaj odległość do nazwy pod kamerą; 0 = bez odległości (mniej gadania)
NativeFace         = 1     ; 1 = obracaj się na cel silnikową funkcją gry (jak FaceObject z Command Extendera); 0 = starym sposobem (zapis kątów)
AimBones           = 0     ; 1 = celuj w kosci szkieletu celu; 0 = (zalecane) w srodek modelu. UWAGA: 1 czyta model 3D z watku moda i wywala gre.
AimMouseTakeover   = 0     ; 1 = ruch myszy przerywa trzymanie celu; 0 = (bez myszy) tylko puszczenie celowania przerywa
HostileFromCombat  = 1     ; 1 = (zalecane) wrogiem jest ten, kto walczy z graczem (pytamy silnik); 0 = najblizszy aktor
;   Celowanie w kosci bylo wylaczone po awarii; przyczyna byla w zabezpieczeniu, nie w metodzie, i jest poprawiona.
;   Wlacz na 1 tylko zeby sprawdzic, czy strzaly zaczynaja trafiac.
AimCollision       = 0     ; 0 = celuj w srodek modelu (bezpieczne); 1 = probuj bryly kolizji (potrafilo wywalic gre)
NativeWalk         = 1     ; 1 = (zalecane) auto-chodzenie steruje ruchem gracza wprost, ZADNYCH wciskanych klawiszy - dzieki temu da sie je zawsze zatrzymac; 0 = po staremu, klawiszami W/A/S/D
AutoWalkSpeed      = 160   ; prędkość auto-chodzenia w jednostkach gry na sekundę (przy NativeWalk=1)
QuestArriveDist = 0      ; 0 = idz az do samego markera (zalecane); wieksza liczba = zatrzymaj sie tyle jednostek przed nim
;   Marker zadania to MIEJSCE, nie przedmiot: bywa w �rodku dekoracji albo za
;   lini�, przed kt�r� masz sta�. Bez tego marsz kr��y� wok� niego bez ko�ca.
;   0 = wy��cz i dochod� do samego markera.
WalkAnimation      = 1     ; 1 = animacja chodu przy auto-chodzeniu (przywraca też prawdziwe odgłosy kroków gry)
FootstepCue        = 1     ; 1 = dźwięk kroków przy auto-chodzeniu (gra swoich nie odtwarza, gdy mod steruje ruchem)
BarterWarnLossCaps = 10    ; ostrzeżenie gdy oddajesz >=N capsli wartości
NearbyScanRadius   = 1200  ; w jednostkach gry; ~64 jedn. = 1 metr
NearbyScanMaxItems = 8
HideEmptyContainers = 1     ; 1 = skaner pomija puste pojemniki, 0 = pokazuje je z dopiskiem „pusty”
EnginePath          = 1     ; 1 = trasę auto-chodzenia wyznacza silnik gry (tak jak dla postaci), 0 = tylko trasa moda
Hints               = 1     ; podpowiedzi gry ("Aby oddać strzał..."): 0 = nigdy, 1 = raz na sesję gry, 2 = za każdym razem
EngineAim           = 15    ; trzymanie ] pozwala grze dokręcić pocisk do wroga o tyle stopni (silnikowa korekta, tylko wrogowie); 0 = wyłączone
CompassUnits       = 0     ; 0 = godziny zegara, 1 = stopnie
AutoWalkTurnGain   = 4     ; siła skrętu auto-chodzenia; więcej = ostrzej, mniej = łagodniej
ActivatePickRadius = 150   ; tolerancja aktywacji (End); więcej = łatwiej trafić, 0 = bez zmian

[Hotkeys]
ReadSelection   = 0x1C   ; Enter   — odczytaj aktualnie zaznaczony element
RepeatLast      = 0x35   ; /       — powtórz ostatnią wypowiedź
Silence         = 0x39   ; Spacja  — uciszenie
WhereAmI        = 0x26   ; L       — lokalizacja gracza
PlayerStatus    = 0x23   ; H       — HP, AP, RAD, capsy
QuestTarget     = 0x25   ; K       — kierunek i dystans do questmarkera
ScanNearby      = 0x2D   ; X       — najbliższe NPC, drzwi, kontenery
ScanHostiles    = 0x2E   ; C       — tylko wrogowie
DescribeCompass = 0x24   ; J       — co jest na kompasie (F jest zajęte przez grę: zmiana widoku)
ToggleMod       = 0x58   ; F12     — włącz/wyłącz mod
DumpMenuTree    = 0x57   ; F11     — diagnostyka: zrzut drzewa aktywnego menu do logu
DebugStartGame  = 0x44   ; F10     — uruchom komendę [Debug] StartGameCommand (np. coc)
MenuBack        = 0x0E   ; Backspace — cofnij o jeden poziom menu (klika przycisk Wstecz)
RestoreDefaults = 0x13   ; R         — przywróć domyślne sterowanie (na stronie ustawień sterowania)
LockEnemy       = 0x14   ; T         - obroc sie na najblizszego wroga (gdy celowanie zawiedzie, VATS ma cel przed soba)
SkipObjective   = 0x0D   ; =         — przeskocz niedostępny cel (przesuwa quest o etap dalej); używać świadomie
VatsBodyPart    = 0      ; wylaczone - w FO3 klawisz B wychodzi z VATS, a przycisk zmiany czesci ciala jest niewidoczny
CenterCamera    = 0xC7   ; Home      — wypoziomuj widok (pion na 0; pierwsza osoba) — jak "center camera"
IntroDescribe   = 0x42   ; F8        — audiodeskrypcja intra: włącza się sama; F8 wyłącza (lub włącza ręcznie do testu)
ScanPrev        = 0xC9   ; Page Up   — poprzedni obiekt (Shift+PgUp = poprz. kategoria)
ScanNext        = 0xD1   ; Page Down — następny obiekt (Shift+PgDn = nast. kategoria)
TurnTo          = 0x28   ; '         — obróć się do wybranego obiektu
GuideBeacon     = 0x27   ; ;         — naprowadzanie dźwiękiem do celu (sam idziesz W)
AutoWalk        = 0x2B   ; \         — automatyczne dojście do celu (otwarty teren)
GuideQuest      = 0x34   ; .         — naprowadzanie dźwiękiem do markera zadania
ActivateTarget  = 0xCF   ; End       — aktywuj wybrany obiekt (bez celowania krzyżykiem)
CrosshairInfo   = 0x22   ; G         — powiedz co jest pod celownikiem
ViewToggle      = 0x21   ; F         — klawisz zmiany widoku gry; mod ogłasza wynik
ItemInfo        = 0x20   ; D         — opis/szczegóły zaznaczonego przedmiotu (w menu)
AimTarget       = 0x33   ; ,         — wyceluj widok w zaznaczony/najbliższy cel (strzelanie bez VATS)
DropItem        = 0xD3   ; Delete    — upuść zaznaczony przedmiot w ekwipunku (odciąża plecak)
Sonar           = 0x31   ; N         — sonar Pip-Boya: dźwięk obiega cię dookoła, każdy obiekt odzywa się ze swojej strony (wróg buczy, pojemnik dzwoni, drzwi pukają)
AimHold         = 0x1B   ; ]         — włącz/wyłącz celowanie (to samo co przytrzymanie prawego przycisku myszy)
AimCalibrate    = 0x00   ; brak      (F9 to szybkie wczytanie gry - ustaw inny klawisz) � KALIBRACJA: osoba widz�ca celuje w wybrany cel
;   i naciska ten klawisz. Mod wylicza z tego rzeczywist� wysoko��, z kt�rej pada strza� �
;   jedyny pomiar, kt�ry nie pochodzi z naszych w�asnych zapis�w.
AimUp           = 0xC8   ; strza�ka w g�r�  � podnie� punkt celowania o 8 jednostek
AimDown         = 0xD0   ; strza�ka w d�  � obni� punkt celowania o 8 jednostek
;   Mod nie widzi, gdzie pad� strza� � Ty to s�yszysz. Te dwa klawisze dostrajaj�
;   celowanie w pionie; raz dobrana poprawka zostaje dla wszystkich cel�w.
PressRow        = 0xD2   ; Insert    — "kliknij" zaznaczoną pozycję w menu; w ustawieniach sterowania wchodzi w tryb zmiany klawisza
AttackKey       = 0x2F   ; V         — klawisz ataku/strzału (seria oddawana po wycelowaniu ,); ustaw tak jak w grze

[Debug]
; Komenda konsoli uruchamiana hotkeyem DebugStartGame (F10).
; Z menu głównego "coc <cela>" startuje nową grę w danej celi, pomijając intro.
; Kandydaci do wypróbowania jeśli MegatonWorld nie zadziała:
;   coc MegatonWorld   coc Megaton   coc TestQAItems   coc Vault101
StartGameCommand = coc MegatonWorld
